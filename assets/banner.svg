<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="border-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="pill-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes chartPulse {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 40; }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 8s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow3 6.5s ease-in-out infinite; }
      .glow-pulse { animation: pulseGlow 5s ease-in-out infinite; }
      .chart-anim { stroke-dasharray: 200; animation: chartPulse 10s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" />

  <!-- Outer Border with subtle gradient glow -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#border-pulse)" stroke-width="2" opacity="0.4" />

  <!-- Subtle grid lines pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Glowing background orbs (ambient light) -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" class="glow-pulse" />
  <circle cx="1020" cy="320" r="160" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="glow-pulse" />
  <circle cx="950" cy="80" r="110" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Background Decorative Visuals (Talent & Growth Metrics Flow) -->
  <g opacity="0.22" class="chart-anim">
    <!-- Animated growth curve behind elements -->
    <path d="M 80,340 C 260,330 380,270 540,290 C 700,310 820,210 1120,150" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <path d="M 80,370 C 300,360 450,320 620,330 C 800,340 940,260 1120,210" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6 6" />
  </g>

  <!-- Background Dynamic Floating Badges (Kept in perimeter so center text is never obscured) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.85" filter="url(#pill-shadow)" />
    <circle cx="20" cy="19" r="6" fill="#3b82f6" />
    <text x="36" y="24" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⭐ 360° FEEDBACK</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(950, 48)">
    <rect width="190" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.85" filter="url(#pill-shadow)" />
    <circle cx="20" cy="19" r="6" fill="#a855f7" />
    <text x="36" y="24" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🎯 OKR ALIGNMENT</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-2" transform="translate(70, 342)">
    <rect width="215" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.85" filter="url(#pill-shadow)" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🌱 CAREER PATHWAYS</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-3" transform="translate(920, 342)">
    <rect width="220" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" opacity="0.85" filter="url(#pill-shadow)" />
    <circle cx="20" cy="19" r="6" fill="#ec4899" />
    <text x="36" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">💡 COMPETENCY MODELS</text>
  </g>

  <!-- Center Card (Glassmorphism backdrop) for Foreground Text -->
  <g filter="url(#soft-shadow)">
    <rect x="190" y="105" width="820" height="210" rx="20" fill="url(#card-grad)" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />
  </g>

  <!-- Subtle glow line divider -->
  <rect x="250" y="105" width="700" height="2" fill="url(#line-glow)" />

  <!-- Top Badge inside Center Card -->
  <g transform="translate(470, 125)">
    <rect width="260" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <text x="130" y="17" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- FOREGROUND TEXT: TITLE -->
  <g>
    <text x="600" y="205" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Talent Management
    </text>
  </g>

  <!-- FOREGROUND TEXT: SUBTITLE -->
  <g>
    <text x="600" y="245" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated Directory of Enterprise SaaS Platforms &amp; Open-Source Frameworks
    </text>
  </g>

  <!-- FEATURE TAGS ROW IN FOREGROUND -->
  <g transform="translate(600, 285)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#38bdf8">⚡ Performance Reviews</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#818cf8">🎯 OKR Tracking</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#c084fc">🔄 360° Feedback</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#34d399">📈 Succession &amp; Growth</tspan>
    </text>
  </g>
</svg>
